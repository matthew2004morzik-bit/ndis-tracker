<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NDIS Plan Tracker</title>
<style>
:root{--bg:#faf5ff;--card:#fff;--tx:#2a1f3d;--mu:#7b6f8e;--bd:#eddcf7;--ac:#8b3fd9;--acx:#fff;--ok:#16a34a;--bad:#dc2626;--bar:#e6ebf2;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141b;--card:#18202a;--tx:#e8edf3;--mu:#97a3b3;--bd:#2a3441;--ac:#c18bd0;--acx:#1a0b1e;--ok:#4ade80;--bad:#f87171;--bar:#2a3441;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f141b;--card:#18202a;--tx:#e8edf3;--mu:#97a3b3;--bd:#2a3441;--ac:#c18bd0;--acx:#1a0b1e;--ok:#4ade80;--bad:#f87171;--bar:#2a3441;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:14px 14px 90px;max-width:640px;margin-inline:auto}
h1{font-size:27px;font-weight:800;margin:4px 0 14px}
.card{background:var(--card);border:2px solid var(--bd);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 6px 18px rgba(139,63,217,.10)}
.hero{background:linear-gradient(135deg,#8b3fd9,#ec4899 60%,#f59e0b);color:#fff;border:0;box-shadow:0 10px 24px rgba(236,72,153,.35)}
.hero .big{font-size:40px;font-weight:800;line-height:1.15}
.sec{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mu);font-weight:600;margin:12px 0 6px}
.hero .sec{color:inherit;opacity:.85;margin:0}
.ttl{font-weight:700;font-size:17px}
.sm{font-size:13px;color:var(--mu)}
.hint{font-size:13px;color:var(--mu);margin:8px 0 0}
.row{margin:6px 0}
.row .t{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.track{height:14px;border-radius:10px;background:var(--bar);overflow:hidden;margin-top:5px}
.fill{height:100%;background:linear-gradient(90deg,#8b3fd9,#ec4899);border-radius:10px;transition:width .6s}
.over .fill{background:var(--bad)}.over .rem{color:var(--bad)}
.rem{color:var(--ok);font-weight:600;white-space:nowrap}
.ln{border-top:1px solid var(--bd);padding-top:10px;margin-top:10px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 3px}
input,select,textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
button{font:inherit;border:0;border-radius:16px;padding:12px 16px;background:linear-gradient(135deg,#8b3fd9,#ec4899);color:#fff;font-weight:700;cursor:pointer;transition:transform .1s}button:active{transform:scale(.95)}
button.sec2{background:var(--bar);color:var(--tx)}
button.x{background:transparent;color:var(--mu);padding:6px 8px}
button.full{width:100%;margin-top:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inv{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--bd)}
.r{text-align:right}
details.acc>summary{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;list-style:none;min-height:44px}details.acc>summary::-webkit-details-marker{display:none}.chev{font-size:20px;color:var(--ac);transition:transform .2s}details[open]>summary .chev{transform:rotate(180deg)}details.acc[open]>summary{margin-bottom:6px}
details.acc:not([open])>summary .chev{transform:rotate(-90deg)}details.acc:not(.scr):active{transform:scale(.98)}details.scr>summary .chev{display:none}details.scr>summary{cursor:default}details.scr>summary .ttl{font-size:21px}button.back{margin-bottom:12px;padding:9px 16px}
.pick{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;margin:5px 0;text-align:left;background:var(--bg);color:var(--tx);border:2px solid var(--bd);font-weight:400}.pick.on{border-color:var(--ac);background:var(--bar)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}.stats b{display:block;font-size:19px}.neg{color:var(--bad)}
.hs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.hs b{display:block;font-size:20px}.hs .sec{margin:0 0 2px}
#msg{font-size:13px;color:var(--bad);min-height:18px;margin-top:8px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:transparent;color:var(--mu);border-radius:0;padding:14px 4px;font-size:14px}
nav button.on{color:var(--ac);font-weight:800}nav button span{display:block;font-size:22px}
</style>
</head>
<body>
<main id="app"></main>
<nav><button data-tab="sum"><span>🌈</span>Summary</button><button data-tab="inv"><span>🧾</span>Invoices</button><button data-tab="plan"><span>⚙️</span>Plan</button><button data-tab="about"><span>ℹ️</span>About</button></nav>
<script>
function rep(n,v){return Array(n).fill(v)}
function seed(){return {
plan:{start:'2026-05-14',end:'2029-05-13'},
comps:[
{id:'cf',name:'Core Flexible (plan-managed)',months:3,amts:rep(12,12764.2)},
{id:'cc',name:'Choice and Control (plan management)',months:1,amts:rep(36,104.45)},
{id:'dl',name:'Improved Daily Living Skills',months:6,amts:[23607.87,23607.87,12735.39,12735.39,4013.4,1685.52]},
{id:'sc',name:'Support Coordination',months:12,amts:[3004.2,1201.68,1201.68]},
{id:'rt',name:'Recurring Transport (self-managed)',months:12,amts:[1189.34,1189.33,1189.33]}],
lines:[
{id:'l1',comp:'cf',name:'Self-care – Saturday',rate:98.83,total:10278.32},
{id:'l2',comp:'cf',name:'Self-care – Sunday',rate:127.43,total:13252.72},
{id:'l3',comp:'cf',name:'Personal domestic activities',rate:59.06,total:46066.8},
{id:'l4',comp:'cf',name:'Household tasks',rate:58.03,total:5570.88},
{id:'l5',comp:'cf',name:'Group activities – Saturday (1:2)',rate:49.42,total:19570.32},
{id:'l6',comp:'cf',name:'Community access – weekday',rate:70.23,total:58431.36},
{id:'l7',comp:'cc',name:'Plan management monthly fee',rate:0,total:3760.2},
{id:'l8',comp:'dl',name:'Occupational therapist',rate:193.99,total:17459.1},
{id:'l9',comp:'dl',name:'Psychologist',rate:232.99,total:6989.7},
{id:'l10',comp:'dl',name:'Daily planning and budgeting',rate:70.23,total:16855.2},
{id:'l11',comp:'dl',name:'Skill development and training',rate:70.23,total:37081.44},
{id:'l12',comp:'sc',name:'Support coordination level 2',rate:100.14,total:5407.56},
{id:'l13',comp:'rt',name:'Recurring transport',rate:0,total:3568}],
inv:[]}}
var FSEL=null,OPEN={hours:1,log:1,add:1,hist:1},scr=null,S=seed(),tab='sum',pend=null,lastLine='',timer=null;
var $=function(s){return document.querySelector(s)};
var uid=function(){return Math.random().toString(36).slice(2,9)};
var pd=function(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
var fd=function(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
var today=function(){var n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())};
var addD=function(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n)};
function addM(d,n){var m=d.getMonth()+n,dim=new Date(d.getFullYear(),m+1,0).getDate();return new Date(d.getFullYear(),m,Math.min(d.getDate(),dim))}
var money=function(n){return (n<0?'-':'')+'$'+Math.abs(n||0).toLocaleString('en-AU',{minimumFractionDigits:2,maximumFractionDigits:2})};
var hrs=function(n){return (Math.round((n||0)*100)/100)+' h'};
var show=function(d){return d.toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'2-digit'})};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var sum=function(a){return a.reduce(function(x,y){return x+y},0)};

function periods(c){var ps=pd(S.plan.start);return c.amts.map(function(a,k){return {s:addM(ps,k*c.months),e:addD(addM(ps,(k+1)*c.months),-1)}})}
function curIdx(c,t){var P=periods(c),k=0;P.forEach(function(p,i){if(p.s<=t)k=i});return k}
function used(l,from,to){var h=0,a=0;S.inv.forEach(function(i){if(i.line!==l.id)return;var d=pd(i.date);if((!from||d>=from)&&(!to||d<=to)){h+=+i.hours||0;a+=+i.amt||0}});return {h:h,a:a}}
function cused(c,from,to){var a=0;S.lines.forEach(function(l){if(l.comp===c.id)a+=used(l,from,to).a});return a}
function bar(label,u,lim,f){
  var rem=lim-u,pct=lim>0?Math.max(0,Math.min(100,u/lim*100)):(u>0?100:0);
  return '<div class="row'+(rem<-0.005?' over':'')+'"><div class="t"><span>'+label+' <b>'+f(u)+'</b> of '+f(lim)+'</span><span class="rem">'+(rem>=-0.005?f(rem)+' left':f(-rem)+' over')+'</span></div><div class="track"><div class="fill" style="width:'+pct+'%"></div></div></div>';
}

var EM={cf:'🏠',cc:'🧾',dl:'🌱',sc:'🧭',rt:'🚌'};
var PGC='',PGNEW=[];
var isGen=function(l){return /– general$/.test(l.name||'')};
function ltotal(l){
  if(!isGen(l))return +l.total||0;
  var c=S.comps.find(function(x){return x.id===l.comp});if(!c)return +l.total||0;
  var other=0;S.lines.forEach(function(x){if(x!==l&&x.comp===l.comp&&!isGen(x))other+=+x.total||0});
  return Math.max(0,sum(c.amts)-other);
}
function cstat(c,t){
  var P=periods(c),k=curIdx(c,t),p=P[k],n=c.amts.length,tt=sum(c.amts),prev=sum(c.amts.slice(0,k)),before=cused(c,null,addD(p.s,-1)),inP=cused(c,p.s,p.e),all=cused(c),roll=prev-before,avail=c.amts[k]+roll;
  return {k:k,p:p,n:n,tt:tt,prev:prev,inP:inP,all:all,roll:roll,avail:avail,pl:avail-inP,wl:tt-all,left:n-k};
}
function lstat(c,cs,l){
  var tt=cs.tt,tot=ltotal(l),k=cs.k,p=cs.p,u=used(l),ui=used(l,p.s,p.e),ub=used(l,null,addD(p.s,-1)),r={tot:tot,u:u,ui:ui,alloc:0,roll:0};
  if(tt>0){r.alloc=tot*c.amts[k]/tt;r.roll=tot*cs.prev/tt-ub.a}
  r.mAvail=r.alloc+r.roll;r.mpl=r.mAvail-ui.a;r.mwl=tot-u.a;
  if(+l.rate){var th=tot/l.rate;r.th=th;r.hk=tt>0?th*c.amts[k]/tt:0;r.hr=tt>0?th*cs.prev/tt-ub.h:0;r.hAvail=r.hk+r.hr;r.hpl=r.hAvail-ui.h;r.hwl=th-u.h}
  return r;
}
function lf(v,f){return v<-0.005?'<span class="neg">'+f(-v)+' over</span>':f(Math.max(0,v))+' left'}
function ng(v,f){return v<-0.005?'<b class="neg">'+f(v)+'</b>':'<b>'+f(Math.max(0,v))+'</b>'}
function totals(t){
  var T={pl:0,wl:0,tot:0,used:0,hpl:0,hwl:0,hasH:false,cats:[]};
  S.comps.forEach(function(c){
    var cs=cstat(c,t);if(!cs.tt)return;
    var ch={c:c,cs:cs,hpl:0,hwl:0,hasH:false};
    S.lines.forEach(function(l){if(l.comp!==c.id||!(+l.rate))return;var ls=lstat(c,cs,l);ch.hpl+=ls.hpl;ch.hwl+=ls.hwl;ch.hasH=true});
    T.pl+=cs.pl;T.wl+=cs.wl;T.tot+=cs.tt;T.used+=cs.all;T.hpl+=ch.hpl;T.hwl+=ch.hwl;if(ch.hasH)T.hasH=true;
    T.cats.push(ch);
  });
  return T;
}
function allocText(cid){
  var c=S.comps.find(function(x){return x.id===cid});if(!c)return '';
  var tt=sum(c.amts),al=0;S.lines.forEach(function(l){if(l.comp===cid&&!isGen(l))al+=+l.total||0});
  var un=tt-al;if(Math.abs(un)<0.005)un=0;
  return 'Funding '+money(tt)+' · allocated to items '+money(al)+' · '+(un<-0.005?'<span class="neg">over by '+money(-un)+'</span>':money(un)+' unallocated');
}
function itemBlock(l,ls){
  var r='<div class="ln"><b>'+esc(l.name)+'</b>'+((l.code||+l.rate)?'<div class="sm">'+(l.code?esc(l.code):'')+(l.code&&+l.rate?' · ':'')+(+l.rate?'max '+money(l.rate)+'/h':'')+'</div>':'');
  r+=partsHtml(l);
  r+='<div class="sm">Allocated '+money(ls.tot)+' over the plan · '+money(ls.alloc)+' this period'+(Math.abs(ls.roll)>0.004?' '+(ls.roll<0?'−':'+')+' '+money(Math.abs(ls.roll))+' rollover':'')+'</div>';
  r+=bar('This period · money',ls.ui.a,ls.mAvail,money);
  if(ls.th!==undefined)r+=bar('This period · hours',ls.ui.h,ls.hAvail,hrs);
  r+=bar('Whole plan · money',ls.u.a,ls.tot,money);
  if(ls.th!==undefined)r+=bar('Whole plan · hours',ls.u.h,ls.th,hrs);
  return r+'</div>';
}
function invFeedback(line,date,h,amt){
  var m=$('#msg'),ln=S.lines.find(function(x){return x.id===line}),c=ln&&S.comps.find(function(x){return x.id===ln.comp});
  if(!m||!ln||!c)return;
  var cs=cstat(c,pd(date)),ls=lstat(c,cs,ln);
  m.style.color='var(--tx)';
  m.innerHTML='<b style="color:var(--ok)">Invoice added 🎉</b><br>Deducted '+money(amt)+(h?' and '+hrs(h):'')+' from '+esc((ln.code?ln.code+' – ':'')+ln.name)+'.<br>'+esc(c.name)+' · period '+(cs.k+1)+' ('+show(cs.p.s)+' – '+show(cs.p.e)+'): '+lf(cs.pl,money)+' this period · '+lf(cs.wl,money)+' in the plan.<br>This item: '+lf(ls.mpl,money)+' this period · '+lf(ls.mwl,money)+' in the plan'+(ls.th!==undefined?'<br>Hours: '+lf(ls.hpl,hrs)+' this period · '+lf(ls.hwl,hrs)+' in the plan':'')+'.';
}
function hoursCard(t){
  var T=totals(t),rows='',any=false;
  T.cats.forEach(function(ch){
    if(!ch.hasH)return;any=true;
    rows+='<div class="inv" style="padding:10px 0 4px"><div><b>'+(EM[ch.c.id]||'⭐')+' '+esc(ch.c.name)+'</b><div class="sm">period ends '+show(ch.cs.p.e)+'</div></div><div class="r"><b>'+hrs(ch.hpl)+'</b></div><div class="r"><b>'+hrs(ch.hwl)+'</b></div></div>';
    S.lines.forEach(function(l){if(l.comp!==ch.c.id||!(+l.rate))return;var ls=lstat(ch.c,ch.cs,l);
      rows+='<div class="inv" style="border:0;padding:2px 0 2px 12px"><div class="sm">'+esc(l.name)+(l.code?' · '+esc(l.code):'')+'</div><div class="r sm">'+hrs(ls.hpl)+'</div><div class="r sm">'+hrs(ls.hwl)+'</div></div>'});
  });
  if(any)rows+='<div class="inv" style="padding:10px 0 4px"><div><b>Total hours left</b></div><div class="r"><b>'+hrs(T.hpl)+'</b></div><div class="r"><b>'+hrs(T.hwl)+'</b></div></div>';
  return '<details class="card acc" data-o="hours"'+(OPEN.hours?' open':'')+'><summary><span class="ttl">⏰ Hours remaining</span><span class="chev">▾</span></summary>'+(any?'<div class="inv" style="border:0;padding:6px 0 0"><span class="sm">Support</span><span class="sm r">This period</span><span class="sm r">Whole plan</span></div>'+rows:'<p class="hint">Set a rate on a support to track its hours.</p>')+'</details>';
}
function sumView(){
  var t=today(),T=totals(t);
  var h='<h1>✨ My NDIS Plan</h1><button class="x" data-act="about" style="margin:-8px 0 8px;padding:6px 0;font-size:13px">Version '+VERSION+' ›</button>';
  h+='<div class="card hero"><div class="sec">💰 Whole plan remaining</div><div class="big">'+money(T.tot-T.used)+'</div><div>'+money(T.used)+' used of '+money(T.tot)+(S.plan.end?' · ends '+show(pd(S.plan.end)):'')+'</div>'+
    '<div class="hs"><div><div class="sec">Left this pay period</div><b>'+money(T.pl)+'</b></div>'+(T.hasH?'<div><div class="sec">Hours this pay period</div><b>'+hrs(T.hpl)+'</b></div><div><div class="sec">Hours left in plan</div><b>'+hrs(T.hwl)+'</b></div>':'')+'</div></div>';
  if(!S.plan.start||!S.comps.length)return h+'<div class="card"><div class="ttl">Set up your plan</div><p class="hint">Open the Plan tab, set your plan dates, then add each funding and its support lines, or import a plan file.</p></div>';
  h+=hoursCard(t);
  T.cats.forEach(function(ch){
    var c=ch.c,cs=ch.cs,items=S.lines.filter(function(l){return l.comp===c.id}),al=0;
    items.forEach(function(l){al+=ltotal(l)});
    h+='<details class="card acc" data-o="c'+c.id+'"'+(OPEN['c'+c.id]?' open':'')+'><summary><span style="flex:1;min-width:0"><span class="ttl">'+(EM[c.id]||'⭐')+' '+esc(c.name)+'</span><div class="sm">Period '+(cs.k+1)+' of '+cs.n+' · '+show(cs.p.s)+' – '+show(cs.p.e)+'</div><div class="stats"><div><span class="sm">Left this period</span>'+ng(cs.pl,money)+'</div><div><span class="sm">Left in plan</span>'+ng(cs.wl,money)+'</div></div>'+(ch.hasH?'<div class="sm" style="margin-top:6px">⏰ '+hrs(ch.hpl)+' this period · '+hrs(ch.hwl)+' in plan</div>':'')+'</span><span class="chev">▾</span></summary>';
    h+='<div class="sec">This period</div>'+bar('Money',cs.inP,cs.avail,money);
    h+='<p class="hint">'+money(c.amts[cs.k])+' allocated '+(cs.roll<0?'−':'+')+' '+money(Math.abs(cs.roll))+' '+(cs.roll<0?'overspent in earlier periods':'rolled over')+'</p>';
    h+='<div class="sec">Rest of plan</div>'+bar('Money',cs.all,cs.tt,money);
    h+='<p class="hint">'+cs.left+' period'+(cs.left>1?'s':'')+' left including this one · about '+money(Math.max(0,(cs.tt-cs.all)/cs.left))+' per period to spread it evenly</p>';
    var groups={},order=[];
    items.forEach(function(l){var k=l.cat||'';if(!groups[k]){groups[k]=[];order.push(k)}groups[k].push(l)});
    order.sort(function(a,b){return a.localeCompare(b)});
    order.forEach(function(k){
      var gm={pl:0,wl:0,hpl:0,hwl:0,hasH:false},blocks=groups[k].map(function(l){var ls=lstat(c,cs,l);gm.pl+=ls.mpl;gm.wl+=ls.mwl;if(ls.th!==undefined){gm.hpl+=ls.hpl;gm.hwl+=ls.hwl;gm.hasH=true}return itemBlock(l,ls)}).join('');
      if(k||order.length>1)h+='<div class="sec">'+esc(k||'Other items')+'</div><div class="sm">Left this period '+money(gm.pl)+' · Left in plan '+money(gm.wl)+(gm.hasH?' · '+hrs(gm.hpl)+' / '+hrs(gm.hwl)+' hours':'')+'</div>';
      h+=blocks;
    });
    if(items.length&&Math.abs(al-cs.tt)>0.5)h+='<p class="hint">Item allocations add up to '+money(al)+' of '+money(cs.tt)+' funding ('+(al>cs.tt?'<span class="neg">over by '+money(al-cs.tt)+'</span>':money(cs.tt-al)+' unallocated')+'). Adjust them in the Plan tab.</p>';
    h+='</details>';
  });
  return h+'<p class="hint">Hours per item are spread across funding periods in proportion to the money in each period. Adjust items in the Plan tab.</p>';
}

function invView(){
  var opts=S.comps.map(function(c){var ls=S.lines.filter(function(l){return l.comp===c.id});return ls.length?'<optgroup label="'+esc(c.name)+'">'+ls.map(function(l){return '<option value="'+l.id+'"'+(l.id===lastLine?' selected':'')+'>'+esc((l.code?l.code+' \u2013 ':'')+l.name)+'</option>'}).join('')+'</optgroup>':''}).join('');
  var list=S.inv.slice().sort(function(a,b){return b.date.localeCompare(a.date)}).map(function(i){
    var l=S.lines.find(function(x){return x.id===i.line});
    return '<div class="inv"><div><b>'+esc(l?l.name:'Deleted line')+'</b><div class="sm">'+show(pd(i.date))+(l&&l.code?' \u00b7 '+esc(l.code):'')+(i.note?' · '+esc(i.note):'')+'</div></div><div class="r"><b>'+money(i.amt)+'</b><div class="sm">'+hrs(i.hours)+'</div></div><button class="x" data-act="del" data-id="'+i.id+'">'+(pend===i.id?'Delete?':'✕')+'</button></div>';

function parsePlan(raw){

  var dm=t.match(/plan starts on (\d{2}\/\d{2}\/\d{4}) and ends on (\d{2}\/\d{2}\/\d{4})/i)||t.match(/plan start date (\d{2}\/\d{2}\/\d{4}).{0,80}?reassessment date (\d{2}\/\d{2}\/\d{4})/i);

  while((m=re.exec(t))){var mg=m[2].toLowerCase(),k=m[1].trim()+'|'+mg;if(!seen[k]){seen[k]=1;pairs.push({name:m[1].trim(),mg:mg})}}

  var found=[];
  pairs.forEach(function(p){
    var dup=pairs.filter(function(q){return q.name===p.name}).length>1,
      en=p.name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),
      head=dup?en+'\\s*\\(\\s*'+p.mg+'-?\\s?managed\\s*\\)':en+'(?:\\s*\\([^)]*\\))?',
      hm=new RegExp(head+'\\s+Funding amount:\\s*\\$([\\d,]+\\.\\d{2})','i').exec(t);
    if(hm)found.push({p:p,dup:dup,i:hm.index,total:parseFloat(hm[1].replace(/,/g,''))});
  });

    if(!(f.total>0))return;
    var sec=t.slice(f.i,n+1<found.length?found[n+1].i:endAll),amts=[],ms=[],rr=/(\d+)\s+months?\s+(?:Funding amount\s+)?\$([\d,]+\.\d{2})/g,x;
    while((x=rr.exec(sec))){ms.push(+x[1]);amts.push(parseFloat(x[2].replace(/,/g,'')))}

    var cm=/following support categor(?:y|ies):\s*(.*?)\s*Support details/i.exec(sec);

  });

function parseSchedule(raw,file){

var STOPW={and:1,the:1,with:1,for:1,per:1};
function toks(s){var o=[],seen={};String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').split(' ').forEach(function(w){if(w.length<3||STOPW[w])return;w=w.replace(/s$/,'').slice(0,6);if(!seen[w]){seen[w]=1;o.push(w)}});return o}
function irate(it,region){if(it.r!=null)return it.r;var p=it.p||{};return p[region||'National']||p.National||0}
function suggest(l,items,max,region){
  var c=S.comps.find(function(x){return x.id===l.comp}),cs=(compCats(c)).map(function(k){return k.toLowerCase()}),
    lt=toks(String(l.name||'').replace(/– general$/,'').replace(/^assessment recommendation therapy or training\s*-?\s*/i,'')),res=[],lr=+l.rate||0;
  if(!lt.length)return res;
  items.forEach(function(it){
    var tk={},m=0;toks(it.t).forEach(function(w){tk[w]=1});lt.forEach(function(w){if(tk[w])m++});
    var f=m/lt.length;if(f<0.5)return;
    if(cs.length&&!it.h){var x=(it.c||'').toLowerCase();if(x&&!cs.some(function(k){return x.indexOf(k)>=0||k.indexOf(x)>=0}))return}
    var sc=f,ir=irate(it,region);if(it.h)sc+=0.8;
    if(lr&&ir&&Math.abs(ir/lr-1)<=0.12)sc+=0.25;
    if(/standard/i.test(it.t))sc+=0.02;
    if(/daytime/i.test(it.t))sc+=0.02;
    sc-=it.t.length/10000;
    res.push({it:it,f:f,sc:sc});
  });
  res.sort(function(a,b){return b.sc-a.sc});
  return res.slice(0,max);
}

  }else if(a==='dismissnote'){NOTE='';render()

  }else if(a==='wzgo'){

    var nt=wzCreate();pend=null;NOTE=nt.join('<br>');tab='sum';scr=null;render();window.scrollTo(0,0)
  }else if(a==='bdupload'){$('#bd-file').click()
  }else if(a==='bdapply'){
    if(!BD||!BD.groups)return;
    if(pend!=='bd'){pend='bd';t.textContent='Tap again to replace the items shown';return}
    var bm=applyBreakdown();pend=null;BD=null;tab='plan';scr='items';FSEL=null;PGNEW=[];render();window.scrollTo(0,0);setTimeout(function(){var z=$('#app');if(z){var pz=document.createElement('p');pz.className='hint';pz.style.color='var(--ok)';pz.textContent=bm;z.insertBefore(pz,z.children[1]||null)}},0)
  }else if(a==='pgupload'){$('#pg-file').click()
  }else if(a==='pgview'){scr='pgview';render();window.scrollTo(0,0)
  }else if(a==='pgresume'){scr='pgsel';render();window.scrollTo(0,0)
  }else if(a==='pgseltoggle'){
    var tn=t.dataset.n,on=!STAGE.sel[tn];if(on)STAGE.sel[tn]=1;else delete STAGE.sel[tn];
    t.classList.toggle('on',on);var tb=t.querySelector('b');tb.textContent=(on?'\u2713 ':'')+tb.textContent.replace(/^\u2713 /,'');$('#ps-count').textContent=psCountText();
  }else if(a==='pgselall'||a==='pgselnone'){
    psFiltered().forEach(function(it){if(a==='pgselall')STAGE.sel[it.n]=1;else delete STAGE.sel[it.n]});psRefresh();
  }else if(a==='pgselapply'){
    var m5=applyStage();if(m5){$('#ps-msg').textContent=m5;return}
    var n5=GUIDE.items.length;STAGE=null;scr='pg';render();window.scrollTo(0,0);
    var pm5=$('#pg-msg');if(pm5){pm5.style.color='var(--ok)';pm5.textContent='Added '+n5+' support'+(n5===1?'':'s')+' to the app ('+GUIDE.state+' prices).'}
  }else if(a==='addfrom'||a==='fsel'){PGC=id;FSEL=id;PGNEW=[];scr='items';render();window.scrollTo(0,0)
  }else if(a==='setcode'){
    var ln=S.lines.find(function(x){return x.id===id}),it2=GUIDE&&GUIDE.items.find(function(x){return x.n===t.dataset.n});if(!ln||!it2)return;
    ln.code=it2.n;if(it2.c)ln.cat=it2.c;if(!(+ln.rate)&&it2.r)ln.rate=it2.r;save();render();

  }else if(a==='pgfill'){
    var n=0;S.lines.forEach(function(l){var g=gfind(l.code,l.name);if(g&&g.r){if(!l.code)l.code=g.n;if(!l.cat)l.cat=g.c;if(!(+l.rate)||Math.abs(l.rate-g.r)>=0.005){n++;l.rate=g.r}}});

    var nl={id:uid(),comp:cid,name:it.t,code:it.n,cat:it.c,rate:it.r,total:0};S.lines.push(nl);PGNEW.push(nl.id);save();

    $('#pg-new').innerHTML=pgAddedHtml(cid);$('#pg-alloc').innerHTML=allocText(cid);pgSearch($('#pg-q').value);var ai=$('#pg-new input');if(ai){try{ai.scrollIntoView({block:'center'});ai.focus()}catch(e){}}

  }else if(a==='restore'){
    var chk=parseBackup($('#rb-text').value);if(typeof chk==='string'){$('#rb-msg').textContent=chk;return}
    if(pend!=='rs'){pend='rs';t.textContent='Tap again to replace everything with this backup';return}

  }else if(a==='about'){tab='about';scr=null;pend=null;render();window.scrollTo(0,0)}

    archiveCurrent();S.plan={start:'',end:''};S.comps=[];S.lines=[];S.inv=[];pend=null;scr=null;save();render();window.scrollTo(0,0);
  }else if(a==='doimport'){
    var m=importPlan($('#np-text').value);if(m){$('#np-msg').textContent=m;return}
    tab='sum';scr=null;pend=null;render();window.scrollTo(0,0);
  }else if(a==='pick'){$('#f-line').value=id;document.querySelectorAll('.pick').forEach(function(b){b.classList.toggle('on',b.dataset.id===id)});autoAmt()}else if(a==='addinv'){
    var date=$('#f-date').value,line=$('#f-line').value,h=parseFloat($('#f-hours').value)||0,amt=parseFloat($('#f-amt').value)||0;

    S.inv.push({id:uid(),date:date,line:line,hours:h,amt:amt,note:$('#f-note').value.trim()});
    lastLine=line;save();render();invFeedback(line,date,h,amt);

});
document.addEventListener('toggle',function(e){var o=e.target.dataset&&e.target.dataset.o;if(o)OPEN[o]=e.target.open},true);

document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='pg-comp'||t.id==='pg-cat'){if(t.id==='pg-comp'){PGC=t.value;$('#pg-new').innerHTML=pgAddedHtml(t.value);$('#pg-alloc').innerHTML=allocText(t.value)}pgSearch($('#pg-q').value);return}
  if(t.id==='ps-region'&&STAGE){STAGE.region=t.value;psRefresh();return}
  if(t.id==='ps-cat'&&STAGE){STAGE.cat=t.value;psRefresh();return}
  if(t.id==='wz-plan'||t.id==='wz-bd'||t.id==='wz-pg'){
    var wf=t.files[0];t.value='';if(!wf)return;
    var wm=$('#wz-msg');if(wm){wm.style.color='';wm.textContent='Reading '+wf.name+'...'}
    var isP2=/\.pdf$/i.test(wf.name)||wf.type==='application/pdf',isW2=/\.docx$/i.test(wf.name),kind=t.id,job2;
    if(kind==='wz-plan')job2=pdfText(wf).then(function(tx){var r=parsePlan(tx);if(r.err)throw new Error(r.err);WZ.plan=r;WZ.planName=wf.name});
    else if(kind==='wz-bd')job2=(isW2?docxText(wf):isP2?pdfText(wf):wf.text()).then(function(tx){var r=parseBreakdown(tx);if(r.err)throw new Error(r.err);WZ.bd=tx;WZ.bdName=wf.name});
    else job2=(isP2?pdfText(wf).then(function(tx){return parseSchedule(tx,wf.name)}):wf.text().then(function(tx){return parseCsvAll(tx,wf.name)})).then(function(m){if(m)throw new Error(m);WZ.pg=wf.name});
    job2.then(function(){scr='wz';render();window.scrollTo(0,0)}).catch(function(e){var w2=$('#wz-msg');if(w2){w2.style.color='var(--bad)';w2.textContent='Could not read '+wf.name+': '+(e&&e.message?e.message:e)}});
    return}
  if(t.id==='bd-file'){var f4=t.files[0];if(f4){var bm=$('#bd-msg');bm.style.color='';bm.textContent='Reading the file...';
    var isW=/\.docx$/i.test(f4.name),isP=/\.pdf$/i.test(f4.name)||f4.type==='application/pdf';
    (isW?docxText(f4):isP?pdfText(f4):f4.text()).then(function(tx){var r5=parseBreakdown(tx);if(r5.err){bm.style.color='var(--bad)';bm.textContent=r5.err;return}BD=r5;pend=null;scr='bd';render();window.scrollTo(0,0)}).catch(function(e){bm.style.color='var(--bad)';bm.textContent='Could not read the file: '+(e&&e.message?e.message:e)})}
    t.value='';return}
  if(t.id==='pdf-file'){var f3=t.files[0];if(f3)readPdf(f3);return}
  if(t.id==='pg-file'){var f2=t.files[0];if(f2){
    var pm=$('#pg-msg'),isPdf=/\.pdf$/i.test(f2.name)||f2.type==='application/pdf';
    pm.style.color='';pm.textContent=isPdf?'Reading the PDF...':'Reading the file...';
    var job=isPdf?pdfText(f2).then(function(x){return parseSchedule(x,f2.name)}):new Promise(function(ok){var r2=new FileReader();r2.onload=function(){ok(parseCsvAll(r2.result,f2.name))};r2.readAsText(f2)});
    job.then(function(m2){if(m2){pm.style.color='var(--bad)';pm.textContent=m2;return}scr='pgsel';render();window.scrollTo(0,0)}).catch(function(e){pm.style.color='var(--bad)';pm.textContent='Could not read the file: '+(e&&e.message?e.message:e)});
  }return}
  if(t.id==='np-file'||t.id==='rb-file'){var p=t.id==='np-file'?'np':'rb',f=t.files[0];if(f){var r=new FileReader();r.onload=function(){$('#'+p+'-text').value=r.result;$('#'+p+'-msg').textContent=(p==='np'?'File loaded. Tap Import plan.':'File loaded. Tap Restore backup.')};r.readAsText(f)}return}
  if(t.dataset.plan){S.plan[t.dataset.plan]=t.value;save();return}
  if(t.dataset.pt){var pa=t.dataset.pt.split('|'),pl=S.lines.find(function(x){return x.id===pa[0]}),pp=pl&&pl.parts&&pl.parts[+pa[1]];if(pp){pp[pa[2]]=pa[2]==='u'?t.value:(parseFloat(t.value)||0);recalcParts(pl);save();render()}return}
  if(t.dataset.t){
    var o=S[t.dataset.t].find(function(x){return x.id===t.dataset.id}),k=t.dataset.k;if(!o)return;
    if(k==='amts')o.amts=t.value.split(/[\s,]+/).map(parseFloat).filter(isFinite);
    else if(k==='months')o.months=+t.value;
    else o[k]=t.type==='number'?(parseFloat(t.value)||0):t.value;
    save();
    if(k==='total'&&$('#pg-alloc')&&$('#pg-comp'))$('#pg-alloc').innerHTML=allocText($('#pg-comp').value);
  }
});
